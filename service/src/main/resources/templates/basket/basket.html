<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div th:insert="~{fragment :: header-empty}"></div>
    <div th:insert="~{fragment:: main-menu}"></div>
    <div th:if="${basketProducts.isEmpty()}" class="row">
        <div class="col-md-6 mx-auto">
        <h1>КОРЗИНА ПУСТА :(</h1>
        </div>
    </div>
    <div th:if="${!basketProducts.isEmpty()}">
        <br>
        <div class="row">
            <h1>КОРЗИНА</h1>
        </div>
        <br>
        <br>
        <div class="row">

            <div class="col-10">
                <div th:if="${errors}">
                    <p style="color: red" th:each="error : ${errors}" th:text="${error.message}">Error message</p>
                </div>

                <div style="border-bottom: 1px solid #dcd8d8; margin-bottom: 0.5cm;"
                     th:each="basketProduct : ${basketProducts}">
                    <form th:action="@{/basket-products/{basketProductId}/update(basketProductId=${basketProduct.id})}"
                          method="post" th:object="${basketProduct}">
                        <div class="form-row">
                            <div class=" col-8">
                                <div class="form-row">
                                    <input id="isSelected" type="checkbox"
                                           name="isSelected"
                                           th:checked="${basketProduct.getIsSelected}" onchange="this.form.submit()">
                                    <a th:href="@{/products/{productId}(productId=${basketProduct.product.id})}"
                                       style="margin-left:5px;" for="isSelected"
                                       th:text="|${basketProduct.product.name}|">BasketProductId:
                                    </a>
                                </div>
                                <div class="form-row align-self-top">
                                    <p style="font-size: x-small;"
                                       th:text="|Артикул: ${basketProduct.product.code}|"></p>
                                </div>
                            </div>
                            <div class=" col-2">
                                <div class="form-row">
                                    <input hidden="true"
                                           name="productId"
                                           type="number"
                                           th:value="${basketProduct.product.id}">
                                    <input hidden="true"
                                           name="basketId"
                                           type="number"
                                           th:value="${basketProduct.basket.id}">
                                    <input style="width: 80%;" id="count" type="number"
                                           name="count"
                                           onchange="this.form.submit()"
                                           th:value="${basketProduct.count}">
                                </div>
                                <div class="form-row">
                                    <p style="font-size:x-small;" for="count"
                                       th:text="|${basketProduct.product.price} р/шт|">
                                    </p>
                                </div>

                            </div>
                            <div class=" col-2">
                                <div class="row">
                                    <p th:text="|${basketProduct.sum}руб.|"></p>
                                </div>
                            </div>
                            <div>

                            </div>
                            <div th:if="${errors}" th:each="error : ${errors}">
                                <p style="color: red"
                                   th:text="${T(ru.nvkz.util.CollectionUtils).getMapValue(error.details, basketProduct.id)}">
                                    Error message</p>
                            </div>
                        </div>

                    </form>
                    <div style="margin-bottom: 0.5cm;" class="row">
                        <form th:action="@{/basket-products/{basketProductId}/delete(basketProductId=${basketProduct.id})}"
                              method="post">
                            <button class="btn btn-link" type="submit">Удалить</button>
                        </form>
                    </div>
                </div>

            </div>
            <div class="col-2">

                <div>
                    <h3 class="text-center">Ваш заказ</h3>
                </div>
                <div class="row">
                    <div class="col-sm">
                        <p th:text="|Товары, ${basket.count} шт.|"></p>
                    </div>
                    <div class="col-sm">
                        <p th:text="|${basket.sum} РУБ.|"></p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm">
                        <p>Скидки и акции</p>
                    </div>
                    <div class="col-sm">
                        <p>0 РУБ.</p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm">
                        <p>Итого</p>
                    </div>
                    <div class="col-sm">
                        <p th:text="|${basket.sum} РУБ.|"></p>
                    </div>
                </div>

                <div class="row text-center">
                    <form th:action="@{/orders}" method="post">
                        <button style="background-color: rgb(255,141,62);  color: white;" class="btn" type="submit">Оформить заказ</button>
                    </form>
                </div>


            </div>
        </div>
    </div>

</div>
</body>
</html>
