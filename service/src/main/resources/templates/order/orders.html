<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title.personal-area}">Личный кабинет</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div th:insert="~{fragment :: header-empty}"></div>
    <div th:insert="~{fragment:: main-menu}"></div>
    <div>
        <br>
        <div class="row">
            <div class="col-2" th:insert="~{fragment :: profile-menu}"></div>
            <div class="col-10">

                <div style="border-bottom: 1px solid #dcd8d8;" class="row" th:each="order : ${orders}">
                    <div class="col-sm">
                        <div class="row">
                            <div class="col-11">
                                <div class="row">
                                    <a style="font-size: 20px;" th:href="@{'/orders/' + ${order.id}}" th:text="|Заказ '№' ${order.id}  от ${#dates.format(order.createdAt, 'dd-MM-yyyy')}|">order</a>
                                </div>
                                <div class="row align-self-top">
                                    <p style="font-size: x-small;"
                                       th:text="|Статус: ${order.orderStatus.text}|"></p>
                                </div>
                            </div>
                            <div class="col-1">
                                <div class="row">
                                    <h5 th:text="${order.sum}"></h5>
                                </div>
                                <div class="row align-self-top">
                                    <p style="font-size: x-small;"
                                       th:text="|Количество товаров: ${order.count}|"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
