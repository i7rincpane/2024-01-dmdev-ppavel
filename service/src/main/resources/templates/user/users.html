<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<form action="/users">
    <label for="name">Firstname:
        <input id="name" type="text" name="name" th:value="${filter.name}">
    </label>
    <label for="surname">Surname:
        <input id="surname" type="text" name="surname" th:value="${filter.surname}">
    </label>
    <label for="birthDate">Birthdate:
        <input id="birthDate" type="date" name="birthDate" th:value="${filter.birthDate}">
    </label>
    <div>
        <label for="page">Page:
            <input id="page" type="number" name="page" th:value="${users.metadata.page}">
        </label>
        <label for="size">Size:
            <input id="size" type="number" name="size" th:value="${users.metadata.size}">
        </label>
    </div>
    <button type="submit">Filter</button>
</form>
<div th:each="user : ${users.content}">
    <a th:href="@{'/users/' + ${user.id}}" th:text="|${user.id}. ${user.email}|">User</a>
</div>
</body>
</html>
